name: Build

# Reusable build of hof-blaze and hof-forge with an injected version (see scripts/version.sh).
# Called by ci.yml for every push/PR and by release-finish.yml for official releases.
on:
  workflow_call:
    inputs:
      version:
        description: "Version to inject, e.g. 1.2.0, 1.2.0-rc.3 or 0.0.0+abc1234"
        required: true
        type: string
      ref:
        description: "Commit to build (defaults to the commit of the calling event)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: App (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            archive: zip
          - name: macos-universal
            os: macos-latest
            archive: tar.gz
    env:
      HOF_VERSION: ${{ inputs.version }}
      PACKAGE: hooks-on-fire-${{ inputs.version }}-${{ matrix.name }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libudev-dev

      # Installs the Rust version and components pinned in rust-toolchain.toml.
      - name: Install Rust
        run: |
          rustup toolchain install
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - uses: Swatinem/rust-cache@v2

      # On every OS: the tray and the UI have platform-specific code.
      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked --release

      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --workspace --locked --release

      - name: Build universal binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --workspace --locked --release --target aarch64-apple-darwin
          cargo build --workspace --locked --release --target x86_64-apple-darwin
          mkdir -p target/universal
          for bin in hof-blaze hof-forge; do
            lipo -create -output "target/universal/$bin" \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin"
          done

      # Archive on the runner: upload-artifact drops the executable bit.
      - name: Package
        run: |
          rm -rf dist
          mkdir -p "dist/$PACKAGE"
          case "$RUNNER_OS" in
            Windows) cp target/release/hof-blaze.exe target/release/hof-forge.exe "dist/$PACKAGE/" ;;
            macOS) cp target/universal/hof-blaze target/universal/hof-forge "dist/$PACKAGE/" ;;
            *) cp target/release/hof-blaze target/release/hof-forge "dist/$PACKAGE/" ;;
          esac
          cp -R data/devices data/games "dist/$PACKAGE/"
          cp -R README.md LICENSE LICENSES "dist/$PACKAGE/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            (cd dist && pwsh -NoProfile -Command "Compress-Archive -Path '$PACKAGE' -DestinationPath '$PACKAGE.zip'")
          else
            tar -C dist -czf "dist/$PACKAGE.tar.gz" "$PACKAGE"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: dist/${{ env.PACKAGE }}.${{ matrix.archive }}
          if-no-files-found: error

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all -- --check

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Run shellcheck
        run: shellcheck scripts/*.sh

      - name: Test version and changelog scripts
        run: scripts/test.sh
