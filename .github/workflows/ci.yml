name: CI

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**", "feature/**"]
  pull_request:
    branches: [main, develop, "release/**", "hotfix/**", "feature/**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libudev-dev

      # Installs the Rust version and components pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      # Release build so the binaries can be published as pipeline artifacts below.
      - name: Build
        run: cargo build --workspace --release

      # Also release, to reuse the compiled dependencies of the build step.
      - name: Test
        run: cargo test --workspace --release

      # Artifact uploads drop the Unix executable bit, so pack the binaries into a tarball.
      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/release/hof-blaze target/release/hof-forge dist/
          cp -R data/devices data/games dist/
          cp -R README.md LICENSE LICENSES dist/
          tar -czf hooks-on-fire-${{ runner.os }}.tar.gz -C dist .

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/hof-blaze.exe, target/release/hof-forge.exe dist/
          Copy-Item -Recurse data/devices, data/games dist/
          Copy-Item -Recurse README.md, LICENSE, LICENSES dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hooks-on-fire-${{ runner.os }}
          path: ${{ runner.os == 'Windows' && 'dist/' || format('hooks-on-fire-{0}.tar.gz', runner.os) }}
          if-no-files-found: error
          # Pull request builds are kept 14 days; 0 = repository default for other builds.
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 0 }}
