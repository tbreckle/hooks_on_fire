# GitHub Branch Protection Configuration
#
# This file documents the recommended branch protection settings for the Hooks on Fire project.
# These settings should be applied manually via GitHub Settings or using the GitHub CLI:
#
# for branch in main develop; do
#   gh api -X PUT "repos/{owner}/{repo}/branches/$branch/protection" --input - <<'EOF'
# {
#   "required_status_checks": {
#     "strict": true,
#     "contexts": [
#       "Build / App (linux-x86_64)",
#       "Build / App (windows-x86_64)",
#       "Build / App (macos-universal)",
#       "Build / Format",
#       "Build / Scripts"
#     ]
#   },
#   "enforce_admins": true,
#   "required_pull_request_reviews": {
#     "dismiss_stale_reviews": true,
#     "require_code_owner_review": false,
#     "required_approving_review_count": 1
#   },
#   "restrictions": null,
#   "allow_force_pushes": false,
#   "allow_deletions": false
# }
# EOF
# done

[branch_protection_main]
# Require pull request reviews before merging
require_pull_request_reviews = true
required_approving_review_count = 1
dismiss_stale_reviews = true
require_code_owner_review = false

# Require status checks to pass
require_status_checks = true
strict_status_checks = true
# Required status checks (jobs of ci.yml -> build.yml, named "<caller job> / <job>"):
required_status_checks = [
    "Build / App (linux-x86_64)",
    "Build / App (windows-x86_64)",
    "Build / App (macos-universal)",
    "Build / Format",
    "Build / Scripts"
]

# Require branches to be up to date before merging
require_branches_up_to_date = true

# Enforce all above restrictions for administrators
enforce_for_administrators = true

# Restrict who can push to matching branches
allow_force_pushes = false
allow_deletions = false

[branch_protection_develop]
# Same settings and required status checks as main. Back-merge PRs come from backmerge/X.Y.Z
# (with develop merged in), so "up to date" works for them too.
require_pull_request_reviews = true
required_approving_review_count = 1
dismiss_stale_reviews = true
require_status_checks = true
strict_status_checks = true
require_branches_up_to_date = true
enforce_for_administrators = true
allow_force_pushes = false
allow_deletions = false
