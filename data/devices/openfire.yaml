---
# Device file for OpenFIRE light guns.
device:
  type: lightgun
  name: openfire
  display-name: OpenFire
  connection-type: serial
  connection-details:
    speed: 115200
  max-instances: 4
  enter_game:
    - M0x0 # Set device mode to Mouse & Keyboard.
    - S6 # Start with everything enabled.
    - F1x2x1 # Rumble shortly.
    - F3x2x3 # Pulse LED green three times.
    - M1x2 # Set offscreen button mode enabled.
    - M8x0 # Disable autofire.
  leave_game:
    - F2x2x2 # Pulse LED red once.
    - E
  lightgun_enable_autofire:
    - M8x2 # Enable autofire.
  lightgun_disable_autofire:
    - M8x0 # Disable autofire.
  lightgun_recoil:
    - F0x2x1 # Pulse solenoid once.
  lightgun_reload:
    - F1x2x1 # Rumble once.
  lightgun_damage:
    - F1x2x2 # Rumble twice on damage.
    - F2x2x1 # Pulse LED red once on damage.
  lightgun_shake:
    - F1x2x3 # Rumble thrice on shake.
