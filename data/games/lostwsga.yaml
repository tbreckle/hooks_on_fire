---
# Game file for "The Lost World: Jurassic Park" (game name: lostwsga).
players:
  count: 2
# The light guns stay in standalone mode: Hooks on Fire sends them nothing for this game.
suppression:
  - lightgun
signals:
  - signal: ___startup
    player: ___all
    commands:
      - lamp_generic
      - lamp_coin
  - signal: ___teardown
    player: ___all
    commands: []
  - signal: LampStart
    player: 1
    commands:
      - lamp_start
  - signal: LampView1
    player: 2
    commands:
      - lamp_start
  - signal: LampView2
    player: ___all
    commands:
      - lamp_coin
  - signal: LampView3
    player: ___all
    commands: []
  - signal: LampView4
    player: ___all
    commands: []
  - signal: LampLeader
    player: ___all
    commands: []
  - signal: RawDrive
    player: ___all
    commands: []
  - signal: RawLamps
    player: ___all
    commands: []
